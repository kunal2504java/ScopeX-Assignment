services:
  - type: web
    name: scopex-admin
    env: node
    region: oregon
    plan: free
    buildCommand: bash render-build.sh
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 18.17.0
